<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Game Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #020817;
      --panel: #0b1220;
      --panel-2: #111827;
      --line: #1f2937;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --blue: #0ea5e9;
      --purple: #7c3aed;
      --green: #10b981;
      --red: #dc2626;
      --orange: #f59e0b;
      --shadow: 0 10px 24px rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    body { overflow: hidden; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      background: #111827;
      border-right: 1px solid var(--line);
      padding: 1rem;
      overflow-y: auto;
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #a5f3fc;
      margin-bottom: 1.5rem;
    }

    .section {
      margin-bottom: 1.4rem;
      background: rgba(11,18,32,0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.9rem;
    }

    .section-title {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .button {
      width: 100%;
      padding: 0.8rem 1rem;
      margin: 0.35rem 0;
      border: none;
      background: #1e293b;
      color: white;
      border-radius: 10px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .button:hover { opacity: 0.96; transform: translateY(-1px); }
    .button.primary {
      background: linear-gradient(135deg, var(--purple), #2563eb);
    }
    .button.danger { background: var(--red); }
    .button.active { background: var(--blue); }

    .project-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .project-button {
      text-align: left;
      background: #0f172a;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
    }
    .project-button.active {
      background: rgba(14,165,233,0.16);
      border-color: rgba(14,165,233,0.9);
    }

    .api-config {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .api-config label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .api-config input, .api-config select {
      width: 100%;
      padding: 0.7rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #020817;
      color: var(--text);
    }
    .api-status {
      margin-top: 0.5rem;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 0.76rem;
      background: #020817;
    }
    .api-status.ok { color: #10b981; border-color: rgba(16,185,129,0.8); }
    .api-status.error { color: #f87171; border-color: rgba(248,113,113,0.7); }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.9);
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .topbar h2 { margin: 0; font-size: 1.3rem; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .mini-btn { min-width: 120px; }

    .workspace {
      display: grid;
      grid-template-columns: 220px 1fr 330px;
      flex: 1;
      min-height: 0;
      background: var(--bg);
    }

    .file-tree {
      border-right: 1px solid var(--line);
      background: rgba(11,18,32,0.9);
      padding: 1rem 0.7rem;
      overflow-y: auto;
    }

    .file-item {
      background: #111827;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.6rem 0.7rem;
      cursor: pointer;
      margin: 0.2rem 0;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item:hover { border-color: rgba(14,165,233,0.55); }
    .file-item.active { background: rgba(14,165,233,0.18); border-color: rgba(14,165,233,0.8); }

    .editor-pane {
      padding: 1rem;
      min-width: 0;
    }
    .editor {
      width: 100%;
      height: 100%;
      min-height: 300px;
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      padding: 1rem;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.45;
      resize: none;
    }

    .chat-panel {
      border-left: 1px solid var(--line);
      background: rgba(11,18,32,0.9);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .chat-output {
      flex: 1;
      overflow-y: auto;
      background: #020817;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.8rem;
      margin-bottom: 0.8rem;
      min-height: 120px;
    }
    .message {
      background: #111827;
      border-left: 3px solid #7c3aed;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      margin: 0.4rem 0;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.ai { border-left-color: var(--blue); }
    .message.success { border-left-color: var(--green); }
    .message.error { border-left-color: var(--red); }
    .prompt {
      width: 100%;
      min-height: 90px;
      max-height: 140px;
      resize: vertical;
      background: #020817;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.8rem;
      color: var(--text);
      margin-bottom: 0.8rem;
    }

    .loading {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--blue);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2,8,23,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #0f172a;
      border: 1px solid var(--line);
      border-radius: 18px;
      width: min(1000px, 90vw);
      max-height: 86vh;
      overflow: auto;
      padding: 1.2rem;
      box-shadow: var(--shadow);
    }
    .modal-header {
      margin-bottom: 1rem;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1rem 0 1.4rem;
    }
    .diff-box h4 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .diff-content {
      background: #020817;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.8rem;
      white-space: pre-wrap;
      line-height: 1.45;
      min-height: 220px;
      max-height: 350px;
      overflow: auto;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.75rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 1fr 320px; }
      .file-tree { display: none; }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .workspace { grid-template-columns: 1fr; }
      .chat-panel { border-left: none; border-top: 1px solid var(--line); }
      .sidebar { display: none; }
      .topbar { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">🎮 AI Game Studio</div>

      <div class="section">
        <div class="section-title">AI Provider</div>
        <div class="api-config">
          <select id="providerSelect" onchange="updateProviderUI(); saveConfig();">
            <option value="local">Локальный режим</option>
            <option value="openai">ChatGPT / OpenAI</option>
            <option value="claude">Claude / Anthropic</option>
          </select>

          <div id="openaiFields" style="display:none;">
            <label>OpenAI API Key</label>
            <input id="openaiKey" type="password" placeholder="sk-..." />
            <label>Model</label>
            <input id="openaiModel" type="text" value="gpt-4o-mini" />
          </div>

          <div id="claudeFields" style="display:none;">
            <label>Anthropic API Key</label>
            <input id="claudeKey" type="password" placeholder="sk-ant-..." />
            <label>Model</label>
            <input id="claudeModel" type="text" value="claude-3-5-sonnet-20241022" />
          </div>

          <div id="apiStatus" class="api-status">Проверьте настройку API</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Projects</div>
        <div class="project-list" id="projectList"></div>
        <button class="button primary" onclick="createProject()">+ Новый проект</button>
      </div>

      <div class="section">
        <div class="section-title">Actions</div>
        <button class="button mini-btn" onclick="exportProjectZip()">⬇️ Экспорт ZIP</button>
        <label class="button mini-btn" style="display:block; text-align:center;">
          ⬆️ Импорт ZIP
          <input id="zipInput" type="file" accept=".zip" onchange="importProjectZip(event)" />
        </label>
      </div>

      <div class="section">
        <div class="section-title">Backups</div>
        <div id="backupList"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="projectTitle">Нет проекта</h2>
        <div class="actions">
          <button class="button mini-btn" onclick="saveCurrentFile()">💾 Сохранить</button>
          <button class="button mini-btn danger" onclick="deleteCurrentFile()">🗑 Удалить</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="file-tree">
          <div class="section-title" style="margin-bottom: 0.5rem;">Files</div>
          <div id="fileTree"></div>
        </aside>

        <section class="editor-pane">
          <textarea id="editor" class="editor" spellcheck="false" placeholder="Выберите файл для редактирования..."></textarea>
        </section>

        <aside class="chat-panel">
          <div class="section-title">AI Assistant</div>
          <div id="chatOutput" class="chat-output"></div>
          <textarea id="promptInput" class="prompt" placeholder="Например: добавь прыжок, систему очков и врагов для Godot"></textarea>
          <button class="button primary" id="generateBtn" onclick="generateAI()">✨ Сгенерировать</button>
        </aside>
      </div>
    </main>
  </div>

  <div id="patchModal" class="modal">
    <div class="modal-card">
      <div class="modal-header">Подтвердите изменения</div>
      <div id="patchSummary" style="color: var(--muted); margin-bottom: 1rem;"></div>
      <div class="diff-grid">
        <div class="diff-box">
          <h4>Было</h4>
          <div id="beforeCode" class="diff-content"></div>
        </div>
        <div class="diff-box">
          <h4>Стало</h4>
          <div id="afterCode" class="diff-content"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="button" onclick="cancelPatch()">Отмена</button>
        <button class="button primary" onclick="applyPatch()">✓ Применить</button>
      </div>
    </div>
  </div>

  <script>
    const storage = {
      getProject(id) {
        return JSON.parse(localStorage.getItem('project_' + id) || '{}');
      },
      setProject(id, data) {
        localStorage.setItem('project_' + id, JSON.stringify(data));
      },
      getProjects() {
        return Object.keys(localStorage)
          .filter(k => k.startsWith('project_'))
          .map(k => JSON.parse(localStorage.getItem(k) || '{}'))
          .filter(p => p && p.id);
      },
      getFile(projectId, filePath) {
        return localStorage.getItem(`file_${projectId}_${filePath}`) || '';
      },
      setFile(projectId, filePath, content) {
        localStorage.setItem(`file_${projectId}_${filePath}`, String(content));
      },
      deleteFile(projectId, filePath) {
        localStorage.removeItem(`file_${projectId}_${filePath}`);
      },
      backup(projectId, filePath, content) {
        const ts = new Date().toISOString().replace(/[:.]/g, '-');
        localStorage.setItem(`backup_${projectId}_${filePath}_${ts}`, String(content));
      },
      getBackups(projectId, filePath) {
        const keys = Object.keys(localStorage).filter(k => k.startsWith(`backup_${projectId}_${filePath}_`));
        return keys.map(k => ({ key: k, ts: k.replace(`backup_${projectId}_${filePath}_`, '') }));
      },
      listFiles(projectId) {
        return Object.keys(localStorage)
          .filter(k => k.startsWith(`file_${projectId}_`))
          .map(k => k.replace(`file_${projectId}_`, ''))
          .sort();
      }
    };

    const state = {
      projectId: null,
      currentFile: null,
      pendingPatch: null
    };

    const config = {
      provider: 'local',
      openai: { key: '', model: 'gpt-4o-mini' },
      claude: { key: '', model: 'claude-3-5-sonnet-20241022' }
    };

    function saveConfig() {
      config.provider = document.getElementById('providerSelect').value;
      config.openai.key = document.getElementById('openaiKey').value;
      config.openai.model = document.getElementById('openaiModel').value;
      config.claude.key = document.getElementById('claudeKey').value;
      config.claude.model = document.getElementById('claudeModel').value;
      localStorage.setItem('aiGameStudioConfig', JSON.stringify(config));
      updateProviderUI();
      updateApiStatus();
    }

    function loadConfig() {
      const saved = JSON.parse(localStorage.getItem('aiGameStudioConfig') || '{}');
      if (saved.provider) config.provider = saved.provider;
      if (saved.openai) config.openai = Object.assign(config.openai, saved.openai);
      if (saved.claude) config.claude = Object.assign(config.claude, saved.claude);

      document.getElementById('providerSelect').value = config.provider;
      document.getElementById('openaiKey').value = config.openai.key;
      document.getElementById('openaiModel').value = config.openai.model;
      document.getElementById('claudeKey').value = config.claude.key;
      document.getElementById('claudeModel').value = config.claude.model;

      updateProviderUI();
      updateApiStatus();
    }

    function updateProviderUI() {
      const provider = document.getElementById('providerSelect').value;
      document.getElementById('openaiFields').style.display = provider === 'openai' ? 'block' : 'none';
      document.getElementById('claudeFields').style.display = provider === 'claude' ? 'block' : 'none';
      saveConfig();
    }

    function updateApiStatus() {
      const status = document.getElementById('apiStatus');
      const provider = config.provider;

      if (provider === 'local') {
        status.textContent = 'Локальный режим: без API';
        status.className = 'api-status ok';
      } else if (provider === 'openai' && config.openai.key) {
        status.textContent = 'ChatGPT подключён';
        status.className = 'api-status ok';
      } else if (provider === 'claude' && config.claude.key) {
        status.textContent = 'Claude подключён';
        status.className = 'api-status ok';
      } else {
        status.textContent = 'API ключ не настроен';
        status.className = 'api-status error';
      }
    }

    function addMessage(text, kind = 'ai') {
      const box = document.getElementById('chatOutput');
      const node = document.createElement('div');
      node.className = `message ${kind}`;
      const icon = kind === 'ai' ? '🤖' : kind === 'success' ? '✅' : kind === 'error' ? '❌' : '⚙️';
      node.innerHTML = `<strong>${icon}</strong> ${text}`;
      box.appendChild(node);
      box.scrollTop = box.scrollHeight;
    }

    function renderProjects() {
      const list = document.getElementById('projectList');
      const projects = storage.getProjects();
      if (!projects.length) {
        list.innerHTML = '<div style="color: var(--muted); font-size: 0.8rem;">Нет проектов</div>';
        return;
      }

      list.innerHTML = projects.map(project => `
        <button class="project-button ${state.projectId === project.id ? 'active' : ''}" onclick="openProject('${project.id}')">
          ${project.name}
        </button>
      `).join('');
    }

    function renderFileTree() {
      const fileTree = document.getElementById('fileTree');
      if (!state.projectId) {
        fileTree.innerHTML = '<div style="color: var(--muted); font-size: 0.8rem;">Нет файлов</div>';
        return;
      }

      const files = storage.listFiles(state.projectId);
      if (!files.length) {
        fileTree.innerHTML = '<div style="color: var(--muted); font-size: 0.8rem;">Файлы отсутствуют</div>';
        return;
      }

      fileTree.innerHTML = files.map(file => `
        <div class="file-item ${state.currentFile === file ? 'active' : ''}" onclick="openFile('${file}')">${file}</div>
      `).join('');
    }

    function renderBackups() {
      const box = document.getElementById('backupList');
      if (!state.projectId || !state.currentFile) {
        box.innerHTML = '<div style="color: var(--muted); font-size: 0.8rem;">Нет резервных копий</div>';
        return;
      }

      const backups = storage.getBackups(state.projectId, state.currentFile);
      if (!backups.length) {
        box.innerHTML = '<div style="color: var(--muted); font-size: 0.8rem;">Нет резервных копий</div>';
        return;
      }

      box.innerHTML = backups.slice(-5).reverse().map(item => `
        <button class="button" onclick="restoreBackup('${item.key}')" style="font-size: 0.8rem;">
          ↩️ ${item.ts}
        </button>
      `).join('');
    }

    function openProject(projectId) {
      state.projectId = projectId;
      state.currentFile = null;
      state.pendingPatch = null;
      const project = storage.getProject(projectId);
      document.getElementById('projectTitle').textContent = project.name || projectId;
      document.getElementById('editor').value = '';
      renderProjects();
      renderFileTree();
      renderBackups();

      const files = storage.listFiles(projectId);
      if (files.length) openFile(files[0]);
    }

    function openFile(filePath) {
      if (!state.projectId) return;
      state.currentFile = filePath;
      document.getElementById('editor').value = storage.getFile(state.projectId, filePath);
      renderFileTree();
      renderBackups();
    }

    function createProject() {
      const name = prompt('Название проекта:');
      if (!name) return;
      const id = name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-_]/g, '');
      const project = { id, name, createdAt: new Date().toISOString() };
      storage.setProject(id, project);

      const seedFiles = {
        'README.md': `# ${name}\n\nПроект создан в AI Game Studio.`,
        'scripts/Main.gd': 'extends Node2D\n\nfunc _ready() -> void:\n    print("Game started")\n',
        'project.godot': '[application]\nconfig/name="' + name + '"\nrun/main_scene="res://scenes/Main.tscn"\n'
      };

      for (const [filePath, content] of Object.entries(seedFiles)) {
        storage.setFile(id, filePath, content);
      }

      renderProjects();
      openProject(id);
      addMessage('Новый проект создан', 'success');
    }

    function saveCurrentFile() {
      if (!state.projectId || !state.currentFile) return;
      const content = document.getElementById('editor').value;
      const previous = storage.getFile(state.projectId, state.currentFile);
      if (previous !== content) {
        storage.backup(state.projectId, state.currentFile, previous);
        storage.setFile(state.projectId, state.currentFile, content);
        addMessage('Файл сохранён', 'success');
      }
      renderBackups();
    }

    function deleteCurrentFile() {
      if (!state.projectId || !state.currentFile) return;
      const ok = confirm(`Удалить ${state.currentFile}?`);
      if (!ok) return;
      storage.deleteFile(state.projectId, state.currentFile);
      state.currentFile = null;
      document.getElementById('editor').value = '';
      renderFileTree();
      renderBackups();
    }

    function cancelPatch() {
      document.getElementById('patchModal').classList.remove('show');
      state.pendingPatch = null;
      addMessage('Изменения отменены', '');
    }

    function applyPatch() {
      if (!state.pendingPatch || !state.projectId) return;
      storage.backup(state.projectId, state.pendingPatch.file, state.pendingPatch.before);
      storage.setFile(state.projectId, state.pendingPatch.file, state.pendingPatch.after);
      document.getElementById('editor').value = state.pendingPatch.after;
      document.getElementById('patchModal').classList.remove('show');
      addMessage('Изменения применены', 'success');
      renderFileTree();
      renderBackups();
      state.pendingPatch = null;
    }

    async function generateAI() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt || !state.projectId || !state.currentFile) return;

      const currentCode = storage.getFile(state.projectId, state.currentFile);
      const button = document.getElementById('generateBtn');
      button.disabled = true;
      button.innerHTML = '<span class="loading"></span>';

      try {
        const result = await callProvider(prompt, currentCode);
        document.getElementById('patchSummary').textContent = result.summary;
        document.getElementById('beforeCode').textContent = currentCode;
        document.getElementById('afterCode').textContent = result.code;
        document.getElementById('patchModal').classList.add('show');
        state.pendingPatch = {
          file: state.currentFile,
          before: currentCode,
          after: result.code,
          summary: result.summary
        };
        addMessage(result.summary, 'ai');
      } catch (err) {
        addMessage('Ошибка генерации: ' + err.message, 'error');
      } finally {
        button.disabled = false;
        button.innerHTML = '✨ Сгенерировать';
        document.getElementById('promptInput').value = '';
      }
    }

    async function callProvider(prompt, currentCode) {
      const provider = config.provider;

      if (provider === 'openai') {
        if (!config.openai.key) throw new Error('OpenAI API key не задан');
        return await callOpenAI(prompt, currentCode);
      }

      if (provider === 'claude') {
        if (!config.claude.key) throw new Error('Anthropic API key не задан');
        return await callClaude(prompt, currentCode);
      }

      return generateLocalFallback(prompt, currentCode);
    }

    async function callOpenAI(prompt, currentCode) {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + config.openai.key
        },
        body: JSON.stringify({
          model: config.openai.model,
          temperature: 0.3,
          max_tokens: 2000,
          messages: [
            {
              role: 'system',
              content: 'Ты помощник для GDScript и Godot. Возвращай только готовый код без комментариев и без лишнего текста.'
            },
            {
              role: 'user',
              content: `Запрос: ${prompt}\n\nТекущий код:\n\n${currentCode}`
            }
          ]
        })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || 'Ошибка OpenAI API');
      }

      const generated = data.choices?.[0]?.message?.content?.trim();
      if (!generated) throw new Error('Пустой ответ модели');
      return { summary: '✅ ChatGPT обновил файл', code: generated };
    }

    async function callClaude(prompt, currentCode) {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': config.claude.key,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: config.claude.model,
          max_tokens: 2000,
          system: 'Ты помощник для GDScript и Godot. Возвращай только готовый код без комментариев и без лишнего текста.',
          messages: [{ role: 'user', content: `Запрос: ${prompt}\n\nТекущий код:\n\n${currentCode}` }]
        })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || 'Ошибка Anthropic API');
      }

      const generated = data.content?.[0]?.text?.trim();
      if (!generated) throw new Error('Пустой ответ модели');
      return { summary: '✅ Claude обновил файл', code: generated };
    }

    function generateLocalFallback(prompt, code) {
      const lower = prompt.toLowerCase();
      let after = code;
      let sum = 'Локальная подсказка';

      if (lower.includes('прыжок') || lower.includes('jump')) {
        after += '\n\nfunc jump() -> void:\n    velocity.y = -jump_force\n';
        sum = '✅ Добавлен прыжок';
      }
      if (lower.includes('атака') || lower.includes('attack') || lower.includes('удар')) {
        after += '\n\nfunc attack() -> void:\n    print("Attack!")\n';
        sum = '✅ Добавлена атака';
      }
      if (lower.includes('монет') || lower.includes('coin') || lower.includes('очки')) {
        after += '\n\nvar coins = 0\nfunc collect_coin() -> void:\n    coins += 1\n    print("Coins: %s" % coins)\n';
        sum = '✅ Добавлена система очков';
      }
      if (lower.includes('враг') || lower.includes('enemy')) {
        after += '\n\nclass Enemy:\n    var health = 10\n    var damage = 2\n';
        sum = '✅ Добавлен враг';
      }

      if (after === code) {
        sum = '⚠️ Не удалось распознать запрос. Попробуйте: прыжок, атака, монета, враг, платформа';
      }

      return { summary: sum, code: after };
    }

    function restoreBackup(backupKey) {
      if (!state.projectId || !state.currentFile) return;
      const backupContent = localStorage.getItem(backupKey);
      if (!backupContent) return;
      storage.setFile(state.projectId, state.currentFile, backupContent);
      document.getElementById('editor').value = backupContent;
      addMessage('Резервная копия восстановлена', 'success');
    }

    async function exportProjectZip() {
      if (!state.projectId) {
        addMessage('Сначала выберите проект', 'error');
        return;
      }

      const zip = new JSZip();
      const files = storage.listFiles(state.projectId);

      for (const file of files) {
        const content = storage.getFile(state.projectId, file);
        zip.file(file, content);
      }

      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.projectId}.zip`;
      a.click();
      URL.revokeObjectURL(url);
      addMessage('Проект экспортирован в ZIP', 'success');
    }

    async function importProjectZip(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      try {
        const zip = await JSZip.loadAsync(file);
        const projectName = prompt('Название проекта:', file.name.replace(/\.zip$/i, '') || 'imported-project');
        if (!projectName) return;

        const projectId = projectName.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-_]/g, '');
        storage.setProject(projectId, { id: projectId, name: projectName, createdAt: new Date().toISOString() });

        const entries = Object.keys(zip.files);
        for (const entry of entries) {
          if (zip.files[entry].dir) continue;
          const content = await zip.files[entry].async('string');
          storage.setFile(projectId, entry, content);
        }

        renderProjects();
        openProject(projectId);
        addMessage('ZIP успешно импортирован', 'success');
      } catch (err) {
        addMessage('Ошибка импорта ZIP: ' + err.message, 'error');
      } finally {
        event.target.value = '';
      }
    }

    function initDefaultProject() {
      const projects = storage.getProjects();
      if (!projects.length) {
        const pid = 'demo-rpg';
        storage.setProject(pid, {
          id: pid,
          name: 'Demo RPG',
          createdAt: new Date().toISOString()
        });

        const files = {
          'README.md': '# Demo RPG\n\nПроект создан в AI Game Studio.',
          'project.godot': '[application]\nconfig/name="DemoRPG"\nrun/main_scene="res://scenes/Main.tscn"\n',
          'scenes/Main.tscn': '[gd_scene]\n[node name="Main" type="Node2D"]\n',
          'scripts/Player.gd': 'extends Node2D\n\nvar speed = 180.0\nvar jump_force = 350.0\n\nfunc _ready() -> void:\n    print("Player ready")\n\nfunc _process(delta: float) -> void:\n    if Input.is_action_pressed("ui_right"):\n        position.x += speed * delta\n'
        };

        for (const [filePath, content] of Object.entries(files)) {
          storage.setFile(pid, filePath, content);
        }
      }

      renderProjects();
      const first = storage.getProjects()[0];
      if (first) openProject(first.id);
    }

    loadConfig();
    initDefaultProject();
  </script>
